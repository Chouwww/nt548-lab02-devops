apiVersion: apps/v1
kind: Deployment
metadata:
  name: nt548-microservice-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nt548-microservice
  template:
    metadata:
      labels:
        app: nt548-microservice
    spec:
      containers:
        - name: microservice
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 80
