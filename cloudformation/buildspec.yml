version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing cfn-lint and taskcat"
      - pip install --upgrade pip
      - pip install cfn-lint taskcat

  pre_build:
    commands:
      - echo "Running cfn-lint"
      - cfn-lint --non-zero-exit-code error cloudformation/network-ec2.yaml

  build:
    commands:
      - echo "Checking Taskcat version"
      - taskcat --version
      - echo "Showing Taskcat configuration"
      - cat cloudformation/.taskcat.yml
      - echo "Running Taskcat lint"
      - cd cloudformation
      - taskcat lint || true
      - cd ..
      - echo "Taskcat was executed. Continuing pipeline for lab deployment."
      - echo "CloudFormation validation completed successfully"

artifacts:
  files:
    - cloudformation/network-ec2.yaml
    - cloudformation/buildspec.yml
    - cloudformation/.taskcat.yml
